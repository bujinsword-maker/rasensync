<script>const lessons = [
{id:'select',title:'基础查询',level:'入门',icon:'{ }',keys:'SELECT DISTINCT AS',desc:'从一张表开始，取出你真正需要的数据。',intro:'SELECT 指定输出列，FROM 指定数据来源。使用 AS 为列取别名；DISTINCT 对整个输出行去重。没有 ORDER BY 时，结果顺序没有保证。',code:"SELECT name AS student_name, city\nFROM students\nORDER BY id;",result:'student_name | city\n林晓         | 北京\n陈墨         | 上海\n苏禾         | 北京\n周雨         | 杭州',tip:'避免把 SELECT * 当成默认写法。明确列名可以让查询意图更清晰，也能减少不必要的数据传输。',ex:[['查询所有学生的姓名和分数，按编号升序。','SELECT name, score\nFROM students\nORDER BY id;','先选择两列，再指定排序。'],['查询不重复的城市，并按城市名称排序。','SELECT DISTINCT city\nFROM students\nORDER BY city;','DISTINCT city 对城市值去重。']]},
{id:'where',title:'条件筛选',level:'入门',icon:'≠',keys:'WHERE AND OR IN BETWEEN',desc:'组合筛选条件，精准定位目标记录。',intro:'WHERE 在分组之前筛选行。比较运算可以结合 AND、OR、IN 与 BETWEEN；AND 优先于 OR，复杂条件建议显式加括号。BETWEEN 包含两端边界。',code:"SELECT name, score\nFROM students\nWHERE city = '北京' AND score >= 85\nORDER BY id;",result:'name | score\n林晓 | 92',tip:'字符串使用单引号。日期范围常用“>= 起点 AND < 下一段起点”，以免遗漏包含时间的记录。',ex:[['查询分数在 80 到 90 之间的学生，包含边界，按编号排序。','SELECT name, score FROM students\nWHERE score BETWEEN 80 AND 90\nORDER BY id;','BETWEEN 80 AND 90 等价于 >= 80 AND <= 90。'],['查询北京或上海、且分数不低于 85 的学生。','SELECT name FROM students\nWHERE city IN (\'北京\', \'上海\')\n  AND score >= 85\nORDER BY id;','IN 可以替代同一列的多个 OR 条件。']]},
{id:'order',title:'排序与分页',level:'入门',icon:'↓',keys:'ORDER BY LIMIT OFFSET DESC',desc:'给结果排好顺序，再取出最值得关注的部分。',intro:'ORDER BY 默认升序 ASC，DESC 表示降序。LIMIT 控制返回数量，OFFSET 跳过指定行数。排序字段相同时，再按唯一编号排序可以使分页更稳定。',code:"SELECT name, score\nFROM students\nORDER BY score DESC, id ASC\nLIMIT 2;",result:'name | score\n林晓 | 92\n周雨 | 92',tip:'这里使用 SQLite / MySQL / PostgreSQL 常见的 LIMIT 写法；SQL Server 通常使用 TOP 或 OFFSET … FETCH。',ex:[['获取分数最低的两名学生，分数相同则按编号升序。','SELECT name, score FROM students\nORDER BY score ASC, id ASC\nLIMIT 2;','升序排列后取前两行。'],['每页两条记录，查询按编号排序的第二页。','SELECT id, name FROM students\nORDER BY id\nLIMIT 2 OFFSET 2;','偏移量 = (页码 - 1) × 每页数量。']]},
{id:'null',title:'空值与文本',level:'入门',icon:'∅',keys:'NULL COALESCE LIKE',desc:'正确处理缺失值，找到文本中的线索。',intro:'NULL 表示未知或缺失，不是 0，也不是空字符串。用 IS NULL / IS NOT NULL 判断空值。COALESCE 返回第一个非空参数。LIKE 中 % 匹配任意长度字符，_ 匹配单个字符。',code:"SELECT name, COALESCE(email, '未填写') AS contact\nFROM students\nWHERE email IS NULL\nORDER BY id;",result:'name | contact\n陈墨 | 未填写\n周雨 | 未填写',tip:'不要用 = NULL 或 <> NULL 判断空值。LIKE 的大小写行为取决于数据库与排序规则。',ex:[['查找姓名以“林”开头的学生。',"SELECT name FROM students\nWHERE name LIKE '林%'\nORDER BY id;",'百分号匹配后续任意字符。'],['查询已填写邮箱的学生姓名和邮箱。','SELECT name, email FROM students\nWHERE email IS NOT NULL\nORDER BY id;','IS NOT NULL 不会排除空字符串；本示例没有空字符串邮箱。']]},
{id:'aggregate',title:'聚合与分组',level:'进阶',icon:'Σ',keys:'COUNT SUM AVG GROUP BY HAVING',desc:'将明细汇总成指标，让数据回答问题。',intro:'COUNT、SUM、AVG、MIN、MAX 将多行汇总。GROUP BY 定义分组粒度；WHERE 过滤原始行，HAVING 过滤聚合结果。COUNT(*) 数行，COUNT(列) 只数该列非 NULL 的值。',code:"SELECT city, COUNT(*) AS total,\n       ROUND(AVG(score), 1) AS avg_score\nFROM students\nGROUP BY city\nORDER BY city;",result:'city | total | avg_score\n上海 | 1     | 85.0\n北京 | 2     | 85.0\n杭州 | 1     | 92.0',tip:'选择列表中没有被聚合的列，应明确放入 GROUP BY；不要依赖某些数据库宽松模式返回的不确定值。',ex:[['统计有邮箱的学生人数。','SELECT COUNT(email) AS with_email\nFROM students;','结果是 2；COUNT(email) 忽略 NULL。'],['找出学生人数至少为 2 的城市。','SELECT city, COUNT(*) AS total\nFROM students\nGROUP BY city\nHAVING COUNT(*) >= 2\nORDER BY city;','得到北京，人数为 2。']]},
{id:'join',title:'多表连接',level:'进阶',icon:'⋈',keys:'INNER JOIN LEFT JOIN ON',desc:'把分散在不同表里的信息关联起来。',intro:'INNER JOIN 只保留匹配行；LEFT JOIN 保留所有左表行，没有匹配的右表列为 NULL。一对多连接会增加结果行数，聚合前先确认数据粒度。',code:"SELECT s.name, c.title\nFROM students AS s\nJOIN enrollments AS e ON e.student_id = s.id\nJOIN courses AS c ON c.id = e.course_id\nORDER BY s.id, c.id;",result:'name | title\n林晓 | Python 入门\n林晓 | SQL 基础\n陈墨 | SQL 基础\n苏禾 | Python 入门',tip:'LEFT JOIN 后，在 WHERE 中要求右表某列等于某个非空值，会过滤掉未匹配行。需要保留左表行时，考虑把右表筛选条件放在 ON 中。',ex:[['列出每个学生及其选课数，包括没有选课的学生。','SELECT s.name, COUNT(e.course_id) AS course_count\nFROM students s\nLEFT JOIN enrollments e ON e.student_id = s.id\nGROUP BY s.id, s.name\nORDER BY s.id;','必须统计右表的非空键；COUNT(*) 会把未匹配的保留行也算进去。'],['找出没有选课的学生。','SELECT s.name FROM students s\nLEFT JOIN enrollments e ON e.student_id = s.id\nWHERE e.student_id IS NULL\nORDER BY s.id;','结果为周雨。']]},
{id:'subquery',title:'子查询与集合',level:'进阶',icon:'⊂',keys:'EXISTS IN UNION 子查询',desc:'把复杂问题拆成多个可以理解的小问题。',intro:'子查询可以提供单个值、一组值或一张派生表。EXISTS 判断是否存在匹配行。UNION 合并并去重，UNION ALL 保留重复行，两侧列数与类型需要兼容。',code:"SELECT name, score\nFROM students\nWHERE score > (SELECT AVG(score) FROM students)\nORDER BY id;",result:'name | score\n林晓 | 92\n周雨 | 92',tip:'NOT IN 的子查询如果包含 NULL，可能让你得不到预期结果。表达“没有匹配记录”时，NOT EXISTS 通常更直接。',ex:[['用 EXISTS 查询至少选过一门课程的学生。','SELECT s.name FROM students s\nWHERE EXISTS (\n  SELECT 1 FROM enrollments e\n  WHERE e.student_id = s.id\n)\nORDER BY s.id;','EXISTS 关心是否有行，不关心 SELECT 1 的值。'],['用 NOT EXISTS 找出没有选课的学生。','SELECT s.name FROM students s\nWHERE NOT EXISTS (\n  SELECT 1 FROM enrollments e\n  WHERE e.student_id = s.id\n)\nORDER BY s.id;','相关子查询引用外层 s.id。']]},
{id:'case',title:'条件表达式',level:'进阶',icon:'↳',keys:'CASE WHEN 条件聚合',desc:'把业务规则写进查询，让结果更有意义。',intro:'CASE 按顺序检查 WHEN，返回第一个匹配条件的 THEN 值；都不匹配则返回 ELSE，没有 ELSE 时返回 NULL。把 CASE 放在 SUM 中，可以进行条件计数。',code:"SELECT name,\n  CASE WHEN score >= 90 THEN '优秀'\n       WHEN score >= 80 THEN '良好'\n       ELSE '继续加油' END AS grade\nFROM students\nORDER BY id;",result:'name | grade\n林晓 | 优秀\n陈墨 | 良好\n苏禾 | 继续加油\n周雨 | 优秀',tip:'先写更严格的条件。若先判断 score >= 80，90 分以上的记录也会先进入这个分支。',ex:[['统计分数不低于 90 的学生人数。','SELECT SUM(CASE WHEN score >= 90 THEN 1 ELSE 0 END)\n  AS excellent_count\nFROM students;','结果为 2；空表的 SUM 返回 NULL，若需 0 可外包 COALESCE。'],['按城市统计分数不低于 85 的人数。','SELECT city,\n  SUM(CASE WHEN score >= 85 THEN 1 ELSE 0 END) AS total\nFROM students\nGROUP BY city\nORDER BY city;','先在行级生成 0 或 1，再按城市求和。']]},
{id:'cte',title:'公共表表达式',level:'深入',icon:'W',keys:'WITH CTE',desc:'给中间结果起个名字，让复杂查询更易读。',intro:'WITH 定义仅在当前语句中可引用的公共表表达式（CTE）。适合分步骤计算、组织复杂查询，不会自动创建永久表，也不保证比子查询快。',code:"WITH city_scores AS (\n  SELECT city, AVG(score) AS avg_score\n  FROM students GROUP BY city\n)\nSELECT city, avg_score\nFROM city_scores\nWHERE avg_score >= 90\nORDER BY city;",result:'city | avg_score\n杭州 | 92.0',tip:'CTE 的实际执行方式由数据库优化器决定。递归 CTE 另有语法与终止条件要求，不应直接当普通循环使用。',ex:[['用 CTE 先筛选 90 分以上学生，再统计人数。','WITH excellent AS (\n  SELECT id FROM students WHERE score >= 90\n)\nSELECT COUNT(*) AS total FROM excellent;','CTE 让筛选步骤有了一个可读的名字。'],['用 CTE 计算各城市人数，返回人数最多的城市（包含并列）。','WITH counts AS (\n  SELECT city, COUNT(*) AS total FROM students GROUP BY city\n)\nSELECT city, total FROM counts\nWHERE total = (SELECT MAX(total) FROM counts)\nORDER BY city;','不能用 LIMIT 1 来保留全部并列第一。']]},
{id:'window',title:'窗口函数',level:'深入',icon:'▥',keys:'OVER PARTITION ROW_NUMBER RANK DENSE_RANK',desc:'保留每一条明细，同时计算排名与组内指标。',intro:'窗口函数通过 OVER 定义计算范围，不像 GROUP BY 那样压缩明细行。PARTITION BY 划分组，ORDER BY 定义窗口内顺序。ROW_NUMBER 编序号；RANK 并列后跳号；DENSE_RANK 并列后不跳号。',code:"SELECT name, score,\n  DENSE_RANK() OVER (ORDER BY score DESC) AS ranking\nFROM students\nORDER BY score DESC, id;",result:'name | score | ranking\n林晓 | 92    | 1\n周雨 | 92    | 1\n陈墨 | 85    | 2\n苏禾 | 78    | 3',tip:'想保留并列排名，不要把唯一 id 放进排名窗口的 ORDER BY。窗口结果通常不能直接在同层 WHERE 中筛选，可以外包 CTE。',ex:[['计算每个学生所在城市的平均分，保留姓名。','SELECT name, city,\n  AVG(score) OVER (PARTITION BY city) AS city_avg\nFROM students\nORDER BY id;','北京的两名学生都得到 85.0。'],['找出每个城市分数最高的学生，包含并列。','WITH ranked AS (\n  SELECT name, city, score,\n    DENSE_RANK() OVER (\n      PARTITION BY city ORDER BY score DESC\n    ) AS rnk\n  FROM students\n)\nSELECT name, city, score FROM ranked\nWHERE rnk = 1\nORDER BY city, name;','先排名，再在外层过滤；RANK 也可以用于本题。']]},
{id:'write',title:'数据修改与事务',level:'深入',icon:'±',keys:'INSERT UPDATE DELETE BEGIN COMMIT ROLLBACK',desc:'理解数据如何写入，以及如何成组提交修改。',intro:'INSERT 添加行，UPDATE 修改行，DELETE 删除行。事务把相关修改作为一个整体提交或回滚。下面的示例使用 SQLite 事务语法，并以 ROLLBACK 结束，保持练习数据不变。',code:"BEGIN;\nUPDATE students SET score = 88 WHERE id = 2;\nSELECT name, score FROM students WHERE id = 2;\nROLLBACK;",result:'事务中的查询：陈墨 | 88\n回滚后分数恢复为 85。',tip:'修改前先用相同 WHERE 条件执行 SELECT 检查范围。没有 WHERE 的 UPDATE / DELETE 会影响所有行。MySQL 开启事务通常写 START TRANSACTION。',ex:[['在事务中把苏禾的分数改为 80，然后回滚。','BEGIN;\nUPDATE students SET score = 80 WHERE id = 3;\nROLLBACK;','使用主键定位，不依赖可能重复的姓名。'],['在事务中新增一名学生，再回滚。',"BEGIN;\nINSERT INTO students (id, name, city, score, email)\nVALUES (5, '许星', '成都', 86, NULL);\nROLLBACK;",'显式列出插入字段。两个练习都不改变初始数据。']]},
{id:'design',title:'表结构与索引',level:'深入',icon:'⌘',keys:'CREATE TABLE PRIMARY KEY INDEX EXPLAIN',desc:'从正确性到查询效率，认识数据背后的结构。',intro:'主键唯一标识记录，外键表达关联，NOT NULL、UNIQUE、CHECK 约束帮助保证数据质量。索引能够加速部分查询，但需要额外存储并增加写入成本；是否使用索引取决于执行计划。',code:"CREATE INDEX idx_students_city\nON students(city);\n\nEXPLAIN QUERY PLAN\nSELECT name FROM students WHERE city = '北京';",result:'执行计划会描述扫描或搜索方式。\n示例数据很小，是否采用索引由优化器决定。',tip:'EXPLAIN QUERY PLAN 是 SQLite 写法。MySQL / PostgreSQL 常使用 EXPLAIN。复合索引需要结合实际筛选、连接和排序模式设计。',ex:[['创建带主键、非空标题和唯一标题约束的笔记表。','CREATE TABLE notes (\n  id INTEGER PRIMARY KEY,\n  title TEXT NOT NULL UNIQUE,\n  body TEXT\n);','主键负责行标识；UNIQUE 防止重复标题。'],['为选课表的课程编号添加索引。','CREATE INDEX idx_enrollments_course\nON enrollments(course_id);','现有复合主键以 student_id 开头；本索引针对按 course_id 查询的场景。']]}
];

);

lessons.push(
{id:'functions',title:'字符串、数值与日期',level:'进阶',icon:'ƒ',keys:'LENGTH SUBSTR ROUND DATE STRFTIME',desc:'清洗文本、处理数值，把日期整理成分析维度。',intro:'函数可以把原始字段转换成适合展示或统计的值。SQLite 的 LENGTH 统计文本字符数，SUBSTR 截取文本，ROUND 控制小数位；DATE 和 STRFTIME 处理日期。日期格式与时区约定应在分析前明确。',code:"SELECT name, LENGTH(name) AS chars,\n       ROUND(score / 100.0, 2) AS ratio\nFROM students ORDER BY id;",result:'name | chars | ratio\n林晓 | 2 | 0.92\n陈墨 | 2 | 0.85\n苏禾 | 2 | 0.78\n周雨 | 2 | 0.92',tip:'SQLite 两个整数相除可能得到整数结果，用 100.0 明确要求小数。MySQL 的 LENGTH 返回字节数，统计字符数要使用 CHAR_LENGTH。',ex:[['取每个学生姓名的第一个字。','SELECT name, SUBSTR(name, 1, 1) AS first_char\nFROM students ORDER BY id;','SUBSTR 的字符位置从 1 开始。'],['将 2026-10-20 格式化为月份，并计算七天后的日期。',"SELECT STRFTIME('%Y-%m', '2026-10-20') AS month,\n       DATE('2026-10-20', '+7 days') AS next_date;",'应得到 2026-10 和 2026-10-27。']]},
{id:'pivot',title:'OLAP 与行列转换',level:'深入',icon:'▦',keys:'PIVOT UNION ALL CASE ROLLUP CUBE OLAP',desc:'从不同维度观察指标，在明细和报表之间转换。',intro:'OLAP 关注按不同维度和层级分析指标。行转列可用条件聚合把类别变成列；列转行可用 UNION ALL 拆开列。ROLLUP 生成层级小计，CUBE 生成多种维度组合小计，但 SQLite 不直接支持这两种语法。',code:"SELECT\n  SUM(CASE WHEN city = '北京' THEN 1 ELSE 0 END) AS beijing,\n  SUM(CASE WHEN city = '上海' THEN 1 ELSE 0 END) AS shanghai,\n  SUM(CASE WHEN city = '杭州' THEN 1 ELSE 0 END) AS hangzhou\nFROM students;",result:'beijing | shanghai | hangzhou\n2       | 1        | 1',tip:'先确定指标粒度，再做透视。不要把已汇总的均值直接平均；整体平均数需要按样本量加权。',ex:[['把每个学生的 score 和 id 两个数值列转换为 metric / value 两列。',"SELECT name, 'score' AS metric, score AS value FROM students\nUNION ALL\nSELECT name, 'id' AS metric, id AS value FROM students\nORDER BY name, metric;",'UNION ALL 保留所有转换后的记录。'],['输出各城市人数和一行总人数，用 row_type 区分明细与总计。',"SELECT 'city' AS row_type, city, COUNT(*) AS total\nFROM students GROUP BY city\nUNION ALL\nSELECT 'total', NULL, COUNT(*) FROM students\nORDER BY row_type, city;",'总计行的 NULL 表示该维度不适用；通过 row_type 与真实缺失城市区分。']]},
{id:'views',title:'视图与复用查询',level:'深入',icon:'V',keys:'CREATE VIEW DROP VIEW',desc:'为常用查询建立统一入口，让定义更容易维护。',intro:'普通视图保存的是查询定义，通常不会保存查询结果。后续查询视图时，会基于当前基础表数据计算。视图与仅在一条语句内存在的 CTE 不同；也不要把普通视图与物化视图混淆。',code:'CREATE VIEW excellent_students AS\nSELECT id, name, score FROM students WHERE score >= 90;\nSELECT name, score FROM excellent_students ORDER BY id;',result:'name | score\n林晓 | 92\n周雨 | 92',tip:'视图不是自动提速机制，也不自动建立权限隔离。执行计划和底层表索引依然重要。',ex:[['创建一个按城市统计人数的视图，并查询。','CREATE VIEW city_counts AS\nSELECT city, COUNT(*) AS total FROM students GROUP BY city;\nSELECT city, total FROM city_counts ORDER BY city;','在新数据库副本中执行，避免同名视图已存在。'],['创建一个只展示姓名与城市的视图，不暴露邮箱列。','CREATE VIEW student_directory AS\nSELECT name, city FROM students;\nSELECT name, city FROM student_directory ORDER BY name;','减少输出字段不等于完成权限配置；数据库授权需要单独管理。']]},
{id:'procedures',title:'变量与存储过程',level:'深入',icon:'P',dialect:'MySQL 8 专题 · 未实机执行',keys:'SET CREATE PROCEDURE CALL 变量 存储过程',desc:'认识数据库端的参数化程序，明确不同数据库的边界。',intro:'MySQL 会话变量以 @ 开头，存储过程用 CREATE PROCEDURE 定义，通过 CALL 调用。参数类型必须明确。SQLite 不支持这种存储过程语法，因此本章需要独立的 MySQL 环境，不能在本页下载的 SQLite 数据库中运行。',code:'SET @threshold = 90;\nSELECT @threshold AS threshold;',result:'threshold\n90',tip:'单条语句的过程体不需要 BEGIN … END。多个语句的过程体在 mysql 命令行中常需要临时更改 DELIMITER；DELIMITER 是客户端命令，不是服务器 SQL。',ex:[['创建一个接收整数并返回其加一结果的存储过程，再传入 4 调用。','CREATE PROCEDURE add_one(IN p_value INT)\nSELECT p_value + 1 AS result;\nCALL add_one(4);','预期返回 5；需要 CREATE ROUTINE 与执行相关权限，且过程名称不能已存在。'],['创建一个接收分数并返回等级的过程，然后传入 92。',"CREATE PROCEDURE score_label(IN p_score INT)\nSELECT CASE WHEN p_score >= 90 THEN '优秀'\n            WHEN p_score >= 80 THEN '良好'\n            ELSE '继续加油' END AS grade;\nCALL score_label(92);",'预期返回优秀。本例假设输入是 0 到 100 的非空整数，生产程序应补充输入校验。']]}
);

$('#app').innerHTML=`<button class="back" data-home>← 返回学习地图</button><section class="lesson-head"><div class="eyebrow">CHAPTER ${String(n+1).padStart(2,'0')} / ${l.level}</div><h1>${l.title}</h1><p>${l.desc}</p><span class="muted">${escapeHTML(l.keys)} · ${l.dialect || "示例基于 SQLite 3.25+"} · <a href="#guide">查看数据表 ↗</a></span></section><section class="panel"><h2>01 / 理解知识点</h2><p>${l.intro}</p>${code(l.code)}<h3 style="font-size:13px">示例结果 / 说明</h3>${code(l.result)}<div class="tip"><strong>记住这一点</strong><br>${l.tip}</div></section><section class="panel"><h2>02 / 动手练习</h2><p class="muted">在下方写下你的思路，再展开参考答案。这里是笔记草稿区，不会执行 SQL，也不会自动判分。</p>${l.ex.map((e,i)=>`<article class="exercise"><h3>练习 ${String(n*2+i+1).padStart(2,'0')}</h3><p>${e[0]}</p><textarea aria-label="练习 ${n*2+i+1} 的 SQL 草稿" data-draft="${l.id}-${i}" spellcheck="false" placeholder="-- 在这里写下你的 SQL">${escapeHTML(drafts[l.id+'-'+i]||'')}</textarea><details><summary>查看提示</summary><p>${e[2]}</p></details><details><summary>展开参考答案</summary>${code(e[1])}</details></article>`).join('')}</section><div class="actions"><button class="primary" id="complete">${done.includes(l.id)?'✓ 已完成 · 点击取消':'标记本章已完成'}</button>${n<lessons.length-1?`<button class="secondary" data-id="${lessons[n+1].id}">下一章：${lessons[n+1].title} →</button>`:'<button class="secondary" data-home>回到学习地图 →</button>'}</div>`;
